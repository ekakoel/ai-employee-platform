services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiep
      POSTGRES_PASSWORD: aiep
      POSTGRES_DB: aiep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiep -d aiep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://aiep:aiep@db:5432/aiep
      JWT_SECRET: change-me-in-production
      AUTH_ENABLED: "false"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/storage
      LOG_JSON: "true"
      LOG_LEVEL: INFO
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.workers.automation_worker", "--all"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aiep:aiep@db:5432/aiep
      WORKER_POLL_SECONDS: "30"
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage_data:
