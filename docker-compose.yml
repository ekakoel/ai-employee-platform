services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: aiep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiep -d aiep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the matching database credentials}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET before starting Compose}
      AUTH_ENABLED: "true"
      ALLOW_LEGACY_USER_HEADER: "false"
      PUBLIC_COMPANY_CREATE: "false"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/storage
      LOG_JSON: "true"
      LOG_LEVEL: INFO
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.workers.automation_worker", "--all"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the matching database credentials}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET before starting Compose}
      AUTH_ENABLED: "true"
      ALLOW_LEGACY_USER_HEADER: "false"
      PUBLIC_COMPANY_CREATE: "false"
      WORKER_POLL_SECONDS: "30"
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage_data:
