name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: Pytest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (tesseract optional for OCR paths)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest full suite (SQLite)
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          # Avoid external LLM calls in CI
          OLLAMA_HOST: ""
        run: |
          pytest -q --tb=line -m "not integration"

      - name: Smoke E2E (Job 54)
        env:
          DATABASE_URL: sqlite:///./ci_smoke.db
        run: |
          pytest -q tests/test_smoke_e2e_job54.py --tb=short

  test-postgres:
    name: Pytest subset (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://aiep:aiep@localhost:5432/aiep
        run: alembic upgrade head

      - name: Pytest infra subset
        env:
          DATABASE_URL: postgresql+psycopg://aiep:aiep@localhost:5432/aiep
        run: |
          pytest -q --tb=line \
            tests/test_production_infra.py \
            tests/test_quotas_job22.py \
            tests/test_admin_job23.py \
            tests/test_alembic_job24.py \
            tests/test_smoke_e2e_job54.py
